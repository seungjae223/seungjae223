name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

permissions: {}

concurrency:
  group: contribution-snake-output
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate light and dark Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#3B82F6&color_dots=#EBEDF0,#DBEAFE,#93C5FD,#60A5FA,#1D4ED8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#161B22,#172554,#1E3A8A,#1D4ED8,#2563EB

      - name: Verify both generated SVGs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for name in (
              "github-contribution-grid-snake.svg",
              "github-contribution-grid-snake-dark.svg",
          ):
              path = Path("dist") / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty SVG: {path}")
              if ElementTree.parse(path).getroot().tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG root: {path}")
              print(f"Verified {path}: {path.stat().st_size} bytes")
          PY

      - name: Publish SVGs to output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          # File preservation and commit history are separate settings.
          keep_files: true
          force_orphan: false
          disable_nojekyll: true
          commit_message: "chore: update contribution Snake"
